<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Universal 360° Asset Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0e1b33; font-family: sans-serif; }

    #container { display: flex; width: 100vw; height: 100vh; position: relative; }

    .pano-panel { flex: 1; height: 100%; position: relative; border-right: 2px solid #1b3f95; }
    .pano-panel:last-child { border-right: none; }

    #pano-right-wrapper { flex: 1; height: 100%; position: relative; }
    #pano-right-wrapper.hidden { display: none; }

    #container.curtain-mode .pano-panel {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    }
    #container.curtain-mode #pano-right-wrapper {
      position: absolute; top: 0; right: 0; left: auto; width: 50vw; height: 100vh;
      overflow: hidden; z-index: 5; border-left: 3px solid #019fc4;
    }
    #container.curtain-mode #pano-right {
      position: absolute; top: 0; right: 0; left: auto; width: 100vw; height: 100vh;
    }

    #curtain-slider {
      display: none;
      position: absolute; top: 0; bottom: 0; left: 50vw; z-index: 30;
      width: 4px; background: #019fc4; cursor: ew-resize;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    #curtain-slider-handle {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 36px; height: 36px; background: #019fc4; border: 2px solid #ffffff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #ffffff; font-weight: bold; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      user-select: none; pointer-events: none;
    }

    #timeseries-strip {
      display: none;
      position: absolute; bottom: 0; left: 0; width: 100%; z-index: 40;
      flex-direction: row; gap: 8px; padding: 12px;
      background: linear-gradient(to top, rgba(14,27,51,0.92), rgba(14,27,51,0));
      overflow-x: auto;
    }
    .ts-thumb {
      flex: 0 0 auto; width: 100px; height: 62px; border-radius: 4px; overflow: hidden;
      cursor: pointer; border: 2px solid rgba(255,255,255,0.25); position: relative;
      background-size: cover; background-position: center; background-color: #0A1428;
      transition: border-color 0.15s ease;
    }
    .ts-thumb:hover { border-color: #7fa8b8; }
    .ts-thumb.active { border-color: #019FC4; box-shadow: 0 0 8px rgba(1,159,196,0.7); }
    .ts-thumb-label {
      position: absolute; bottom: 0; left: 0; right: 0; font-size: 10px; text-align: center;
      background: rgba(0,0,0,0.65); color: #fff; padding: 2px 0; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; pointer-events: none;
    }

    .pano-label {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(14, 27, 51, 0.85); color: #ffffff;
      padding: 6px 12px; font-size: 13px; border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15); pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #label-right { left: auto; right: 12px; top: 56px; }

    #status-banner {
      position: absolute; top: 0; left: 0; width: 100%; z-index: 2000;
      background: rgba(180, 40, 40, 0.92); color: #ffffff; text-align: center;
      padding: 10px; font-size: 14px; display: none; pointer-events: none;
    }

    #control-bar {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      display: flex; gap: 8px; pointer-events: auto;
    }

    .ctrl-btn {
      background: #1b3f95; color: #ffffff; border: 1px solid #019fc4;
      padding: 8px 12px; font-size: 12px; font-weight: bold;
      border-radius: 4px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: all 0.2s ease; user-select: none; position: relative; z-index: 1001;
    }
    .ctrl-btn:hover { background: #019fc4; color: #0e1b33; }
    .ctrl-btn:active, .ctrl-btn.active { background: #019fc4; color: #0e1b33; border-color: #ffffff; }

    .hotspot-pin {
      width: 26px; height: 26px; background: #019fc4; border: 2px solid #ffffff;
      border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(0,0,0,0.5); position: relative;
    }
    .hotspot-pin.hotspot-cat-issue { background: #e05555; }
    .hotspot-pin.hotspot-cat-measurement { background: #4caf6d; }
    .hotspot-pin::after {
      content: 'i'; color: #ffffff; font-weight: bold; font-family: sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100%; font-size: 14px;
    }
    .hotspot-tooltip {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: rgba(14, 27, 51, 0.95); color: #ffffff; padding: 8px 12px;
      border-radius: 4px; font-size: 12px; min-width: 140px; max-width: 220px;
      text-align: center; border: 1px solid #019fc4; display: none; pointer-events: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); white-space: normal;
    }
    .hotspot-tooltip a { color: #6fd3ea; word-break: break-all; }
    .hotspot-pin:hover .hotspot-tooltip { display: block; }

    .hotspot-form {
      position: fixed; z-index: 2000; width: 240px;
      background: #0e1b33; border: 1px solid #019fc4; border-radius: 6px;
      padding: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      font-family: sans-serif; font-size: 12px; color: #ffffff;
    }
    .hotspot-form label { display: block; margin: 8px 0 3px; color: #7fa8b8; }
    .hotspot-form label:first-child { margin-top: 0; }
    .hotspot-form input[type="text"], .hotspot-form textarea, .hotspot-form select {
      width: 100%; box-sizing: border-box; background: #0a1428; color: #ffffff;
      border: 1px solid #22346b; border-radius: 4px; padding: 5px 6px; font-size: 12px;
      font-family: inherit; resize: vertical;
    }
    .hotspot-form-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .hotspot-form-buttons button {
      background: #1b3f95; color: #ffffff; border: 1px solid #019fc4;
      padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .hotspot-form-buttons button.hf-save { background: #019fc4; }
  </style>
  <script src="vendor/marzipano.js"></script>
</head>
<body>

  <div id="status-banner"></div>

  <div id="container">
    <div id="pano-left" class="pano-panel"><div class="pano-label" id="label-left">360° View</div></div>

    <div id="pano-right-wrapper">
      <div id="pano-right" class="pano-panel"></div>
    </div>
    <div class="pano-label" id="label-right">Comparison View</div>

    <div id="curtain-slider"><div id="curtain-slider-handle">↔</div></div>

    <div id="timeseries-strip"></div>

    <div id="control-bar">
      <button id="toggle-btn" class="ctrl-btn" type="button" style="display:none;">Toggle</button>
      <button id="use-view-btn" class="ctrl-btn" type="button" style="display:none;">Use This View</button>
      <button id="unlock-aim-btn" class="ctrl-btn" type="button" style="display:none;">Unlock Independent Aim</button>
      <button id="use-view-left-btn" class="ctrl-btn" type="button" style="display:none;">Use Left View</button>
      <button id="use-view-right-btn" class="ctrl-btn" type="button" style="display:none;">Use Right View</button>
      <button id="edit-hotspots-btn" class="ctrl-btn" type="button" style="display:none;">Edit Hotspots</button>
      <button id="save-hotspots-btn" class="ctrl-btn" type="button" style="display:none;">Save Hotspots</button>
      <button id="autorotate-btn" class="ctrl-btn" type="button">Auto-Rotate</button>
      <button id="fullscreen-btn" class="ctrl-btn" type="button">Full Screen</button>
      <button id="reset-btn" class="ctrl-btn" type="button">Reset View</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let rawSiteId = urlParams.get('site') || urlParams.get('well') || 'hotspot_test';
    const siteId = rawSiteId.trim().toLowerCase().replace(/[\s-]+/g, '_');

    const isLocalPreview = (location.hostname === '127.0.0.1' || location.hostname === 'localhost');
    var useViewBtn = document.getElementById('use-view-btn');

    function sendViewCapture(yawRad, pitchRad, photoIndex) {
      var yawDeg = yawRad * 180 / Math.PI;
      var pitchDeg = pitchRad * 180 / Math.PI;
      var original = useViewBtn.textContent;
      fetch('/__save_view', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ yaw: yawDeg, pitch: pitchDeg, photo_index: photoIndex }),
      }).then(res => {
        useViewBtn.textContent = res.ok ? 'Captured!' : 'Failed, try again';
        setTimeout(() => { useViewBtn.textContent = original; }, 1400);
      }).catch(() => {
        useViewBtn.textContent = 'Preview server not reachable';
        setTimeout(() => { useViewBtn.textContent = original; }, 1800);
      });
    }

    function showBanner(msg) {
      var b = document.getElementById('status-banner');
      b.textContent = msg;
      b.style.display = 'block';
    }

    var container = document.getElementById('container');
    var panelR = document.getElementById('pano-right');
    var wrapperR = document.getElementById('pano-right-wrapper');
    var slider = document.getElementById('curtain-slider');

    var viewerL = new Marzipano.Viewer(document.getElementById('pano-left'));
    var viewerR = null;
    var viewL = null, viewR = null;
    var defaultViewL = { yaw: 0, pitch: 0, fov: Math.PI / 4 };
    var defaultViewR = { yaw: 0, pitch: 0, fov: Math.PI / 4 };
    var limiter = Marzipano.RectilinearView.limit.traditional(4000, 100 * Math.PI / 180);

    var isTimeseriesModeGlobal = false;
    var tsScenes = [], tsViews = [], tsPhotos = [], tsActiveIdx = 0;

    var autorotate = Marzipano.autorotate({ yawSpeed: 0.03, targetPitch: 0, targetFov: Math.PI / 4 });
    var isRotating = false;

    function toggleAutorotate(enable) {
      isRotating = (enable !== undefined) ? enable : !isRotating;
      var btn = document.getElementById('autorotate-btn');
      if (isRotating) {
        viewerL.startMovement(autorotate);
        if (viewerR) viewerR.startMovement(autorotate);
        btn.classList.add('active');
      } else {
        viewerL.stopMovement();
        if (viewerR) viewerR.stopMovement();
        btn.classList.remove('active');
      }
    }

    function toggleFullscreen() {
      var doc = window.document;
      var docEl = doc.documentElement;
      var requestFS = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      var cancelFS = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFS) requestFS.call(docEl);
      } else {
        if (cancelFS) cancelFS.call(doc);
      }
    }

    function resetViews() {
      toggleAutorotate(false);
      if (isTimeseriesModeGlobal && tsViews.length) {
        var p = tsPhotos[tsActiveIdx] || {};
        tsViews[tsActiveIdx].setParameters({ yaw: p.yaw || 0, pitch: p.pitch || 0, fov: Math.PI / 4 });
      } else {
        if (viewL) viewL.setParameters(defaultViewL);
        if (viewR) viewR.setParameters(defaultViewR);
      }
    }

    function selectTimeseries(idx) {
      if (!tsScenes.length || idx === tsActiveIdx) return;
      tsViews[idx].setParameters(tsViews[tsActiveIdx].parameters());
      tsActiveIdx = idx;
      tsScenes[idx].switchTo();
      if (isRotating) viewerL.startMovement(autorotate);
      document.getElementById('label-left').innerText = (tsPhotos[idx] && tsPhotos[idx].label) || ('Photo ' + (idx + 1));
      var strip = document.getElementById('timeseries-strip');
      Array.from(strip.children).forEach((child, i) => child.classList.toggle('active', i === idx));
    }

    document.getElementById('autorotate-btn').addEventListener('click', () => toggleAutorotate());
    document.getElementById('fullscreen-btn').addEventListener('click', () => toggleFullscreen());
    document.getElementById('reset-btn').addEventListener('click', () => resetViews());

    fetch('tiles/' + siteId + '/config.json')
      .then(res => {
        if (res.ok) return res.json();
        throw new Error('missing-config');
      })
      .then(config => {
        const mode = config.mode || 'single';

        if (mode === 'timeseries') {
          isTimeseriesModeGlobal = true;
          wrapperR.classList.add('hidden');
          document.getElementById('label-right').style.display = 'none';

          const isTiledTs = config.format === 'tiled';
          const defaultLevelsTs = [{ tileSize: 256, size: 256, fallbackOnly: true }, { tileSize: 512, size: 512 }, { tileSize: 512, size: 1024 }, { tileSize: 512, size: 2048 }];
          tsPhotos = config.photos || [];
          var strip = document.getElementById('timeseries-strip');
          strip.style.display = 'flex';

          tsPhotos.forEach((p, idx) => {
            var view = new Marzipano.RectilinearView({ yaw: p.yaw || 0, pitch: p.pitch || 0, fov: Math.PI / 4 }, limiter);
            var geometry, source, thumbUrl;
            if (isTiledTs) {
              geometry = new Marzipano.CubeGeometry((p.levels && p.levels.length) ? p.levels : defaultLevelsTs);
              source = Marzipano.ImageUrlSource.fromString('tiles/' + siteId + '/img' + (idx + 1) + '/scene/{z}/{f}/{y}/{x}.jpg');
              thumbUrl = 'tiles/' + siteId + '/img' + (idx + 1) + '/scene/1/f/0/0.jpg';
            } else {
              geometry = new Marzipano.EquirectGeometry([{ width: 4000 }]);
              source = Marzipano.ImageUrlSource.fromString('tiles/' + siteId + '/img' + (idx + 1) + '.jpg');
              thumbUrl = 'tiles/' + siteId + '/img' + (idx + 1) + '.jpg';
            }
            var scene = viewerL.createScene({ source: source, geometry: geometry, view: view });
            renderHotspots(scene, p.hotspots);
            pendingSlotHotspots[String(idx)] = (p.hotspots || []).slice();
            tsScenes.push(scene);
            tsViews.push(view);

            var el = document.createElement('div');
            el.className = 'ts-thumb' + (idx === 0 ? ' active' : '');
            el.style.backgroundImage = "url('" + thumbUrl + "')";
            var lbl = document.createElement('div');
            lbl.className = 'ts-thumb-label';
            lbl.textContent = p.label || ('Photo ' + (idx + 1));
            el.appendChild(lbl);
            el.addEventListener('click', () => selectTimeseries(idx));
            strip.appendChild(el);
          });

          if (tsScenes.length) {
            tsScenes[0].switchTo();
            document.getElementById('label-left').innerText = (tsPhotos[0] && tsPhotos[0].label) || 'Photo 1';
          }

          useViewBtn.addEventListener('click', () => {
            if (!tsViews.length) return;
            var v = tsViews[tsActiveIdx].parameters();
            sendViewCapture(v.yaw, v.pitch, tsActiveIdx);
          });

          document.getElementById('pano-left').addEventListener('click', (e) => {
            if (!editingHotspots || !tsScenes.length) return;
            placeHotspotAt(document.getElementById('pano-left'), tsViews[tsActiveIdx],
                tsScenes[tsActiveIdx], String(tsActiveIdx), e.clientX, e.clientY);
          });

          setTimeout(() => { viewerL.updateSize(); }, 100);
          window.addEventListener('resize', () => { viewerL.updateSize(); });

          if (config.autorotate) toggleAutorotate(true);
          return;
        }

        const isSingleMode = mode === 'single';
        const isCurtainMode = mode === 'curtain';
        const isToggleMode = mode === 'toggle';
        const isTiled = config.format === 'tiled';

        if (isSingleMode || isToggleMode) {
          wrapperR.classList.add('hidden');
          document.getElementById('label-right').style.display = 'none';
        } else if (isCurtainMode) {
          container.classList.add('curtain-mode');
          slider.style.display = 'block';
          viewerR = new Marzipano.Viewer(panelR);
          setupCurtainSlider();
        } else {
          viewerR = new Marzipano.Viewer(panelR);
        }

        defaultViewL = { yaw: config.yaw_1 || 0, pitch: config.pitch_1 || 0, fov: Math.PI / 4 };
        defaultViewR = { yaw: config.yaw_2 || 0, pitch: config.pitch_2 || 0, fov: Math.PI / 4 };

        viewL = new Marzipano.RectilinearView(defaultViewL, limiter);
        viewR = isSingleMode ? null : new Marzipano.RectilinearView(defaultViewR, limiter);

        var geometryL, geometryR, sourceL, sourceR;
        var defaultLevels = [{ tileSize: 256, size: 256, fallbackOnly: true }, { tileSize: 512, size: 512 }, { tileSize: 512, size: 1024 }, { tileSize: 512, size: 2048 }];

        if (isTiled) {
          geometryL = new Marzipano.CubeGeometry(
              (config.levels_1 && config.levels_1.length) ? config.levels_1 : defaultLevels);
          sourceL = Marzipano.ImageUrlSource.fromString('tiles/' + siteId + '/img1/scene/{z}/{f}/{y}/{x}.jpg');
          if (!isSingleMode) {
            geometryR = new Marzipano.CubeGeometry(
                (config.levels_2 && config.levels_2.length) ? config.levels_2 : defaultLevels);
            sourceR = Marzipano.ImageUrlSource.fromString('tiles/' + siteId + '/img2/scene/{z}/{f}/{y}/{x}.jpg');
          }
        } else {
          geometryL = new Marzipano.EquirectGeometry([{ width: 4000 }]);
          geometryR = geometryL;
          sourceL = Marzipano.ImageUrlSource.fromString('tiles/' + siteId + '/img1.jpg');
          if (!isSingleMode) {
            sourceR = Marzipano.ImageUrlSource.fromString('tiles/' + siteId + '/img2.jpg');
          }
        }

        var sceneL = viewerL.createScene({ source: sourceL, geometry: geometryL, view: viewL });
        renderHotspots(sceneL, config.hotspots_1);
        pendingSlotHotspots['1'] = (config.hotspots_1 || []).slice();

        var sceneB = null;
        if (isToggleMode) {
          sceneB = viewerL.createScene({ source: sourceR, geometry: geometryR, view: viewR });
          renderHotspots(sceneB, config.hotspots_2);
          pendingSlotHotspots['2'] = (config.hotspots_2 || []).slice();
        }

        sceneL.switchTo();

        var aimLocked = true;

        if (!isSingleMode && !isToggleMode) {
          var sceneR = viewerR.createScene({ source: sourceR, geometry: geometryR, view: viewR });
          sceneR.switchTo();
          renderHotspots(sceneR, config.hotspots_2);
          pendingSlotHotspots['2'] = (config.hotspots_2 || []).slice();

          var isSyncing = false;
          function syncViews(src, tgt) {
            if (isSyncing || !aimLocked) return;
            isSyncing = true;
            tgt.setParameters(src.parameters());
            isSyncing = false;
          }
          viewL.addEventListener('change', () => syncViews(viewL, viewR));
          viewR.addEventListener('change', () => syncViews(viewR, viewL));
        }

        if (isToggleMode) {
          var toggleBtn = document.getElementById('toggle-btn');
          toggleBtn.style.display = 'inline-block';
          var showingA = true;
          var lbl1 = config.label_1 || 'Photo 1';
          var lbl2 = config.label_2 || 'Photo 2';
          toggleBtn.textContent = 'Show: ' + lbl2;
          toggleBtn.addEventListener('click', () => {
            var fromView = showingA ? viewL : viewR;
            var toView = showingA ? viewR : viewL;
            toView.setParameters(fromView.parameters());
            showingA = !showingA;
            (showingA ? sceneL : sceneB).switchTo();
            if (isRotating) viewerL.startMovement(autorotate);
            document.getElementById('label-left').innerText = showingA ? lbl1 : lbl2;
            toggleBtn.textContent = 'Show: ' + (showingA ? lbl2 : lbl1);
          });
          if (isLocalPreview) useViewBtn.style.display = 'inline-block';
          useViewBtn.addEventListener('click', () => {
            var v = (showingA ? viewL : viewR).parameters();
            sendViewCapture(v.yaw, v.pitch, showingA ? 0 : 1);
          });
          document.getElementById('pano-left').addEventListener('click', (e) => {
            if (!editingHotspots) return;
            var curView = showingA ? viewL : viewR;
            var curScene = showingA ? sceneL : sceneB;
            placeHotspotAt(document.getElementById('pano-left'), curView, curScene,
                showingA ? '1' : '2', e.clientX, e.clientY);
          });
        } else if (isSingleMode) {
          if (isLocalPreview) useViewBtn.style.display = 'inline-block';
          useViewBtn.addEventListener('click', () => {
            var v = viewL.parameters();
            sendViewCapture(v.yaw, v.pitch, 0);
          });
          document.getElementById('pano-left').addEventListener('click', (e) => {
            if (!editingHotspots) return;
            placeHotspotAt(document.getElementById('pano-left'), viewL, sceneL, '1', e.clientX, e.clientY);
          });
        } else {
          var unlockBtn = document.getElementById('unlock-aim-btn');
          var useLeftBtn = document.getElementById('use-view-left-btn');
          var useRightBtn = document.getElementById('use-view-right-btn');
          if (isLocalPreview) {
            unlockBtn.style.display = 'inline-block';
            useLeftBtn.style.display = 'inline-block';
            useRightBtn.style.display = 'inline-block';
          }
          unlockBtn.addEventListener('click', () => {
            aimLocked = !aimLocked;
            unlockBtn.textContent = aimLocked ? 'Unlock Independent Aim' : 'Lock Views Together';
            unlockBtn.classList.toggle('active', !aimLocked);
          });
          useLeftBtn.addEventListener('click', () => {
            var v = viewL.parameters();
            sendViewCapture(v.yaw, v.pitch, 0);
          });
          useRightBtn.addEventListener('click', () => {
            var v = viewR.parameters();
            sendViewCapture(v.yaw, v.pitch, 1);
          });
          document.getElementById('pano-left').addEventListener('click', (e) => {
            if (!editingHotspots) return;
            placeHotspotAt(document.getElementById('pano-left'), viewL, sceneL, '1', e.clientX, e.clientY);
          });
          document.getElementById('pano-right').addEventListener('click', (e) => {
            if (!editingHotspots) return;
            placeHotspotAt(document.getElementById('pano-right'), viewR, sceneR, '2', e.clientX, e.clientY);
          });
        }

        setTimeout(() => {
          viewerL.updateSize();
          if (viewerR) viewerR.updateSize();
        }, 100);
        window.addEventListener('resize', () => {
          viewerL.updateSize();
          if (viewerR) viewerR.updateSize();
        });

        if (config.label_1) document.getElementById('label-left').innerText = config.label_1;
        if (config.label_2 && !isSingleMode) document.getElementById('label-right').innerText = config.label_2;

        if (config.autorotate) toggleAutorotate(true);
      })
      .catch(() => {
        showBanner('No published site found for "' + siteId + '". Check the ?site= parameter or republish this site.');
      });

    function setupCurtainSlider() {
      let isDragging = false;
      var labelLeftEl = document.getElementById('label-left');
      var labelRightEl = document.getElementById('label-right');

      function updateWipe(x) {
        let pct = (x / window.innerWidth) * 100;
        pct = Math.max(0, Math.min(100, pct));
        wrapperR.style.width = (100 - pct) + 'vw';
        slider.style.left = pct + 'vw';
        labelLeftEl.style.opacity = pct < 25 ? '0' : '1';
        labelRightEl.style.opacity = pct > 75 ? '0' : '1';
      }

      slider.addEventListener('mousedown', () => isDragging = true);
      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('mousemove', (e) => { if (isDragging) updateWipe(e.clientX); });

      slider.addEventListener('touchstart', () => isDragging = true);
      window.addEventListener('touchend', () => isDragging = false);
      window.addEventListener('touchmove', (e) => { if (isDragging && e.touches[0]) updateWipe(e.touches[0].clientX); });
    }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s == null ? '' : s;
      return d.innerHTML;
    }

    function makeHotspotElement(spot) {
      var el = document.createElement('div');
      el.className = 'hotspot-pin hotspot-cat-' + (spot.category || 'note');

      var tip = document.createElement('div');
      tip.className = 'hotspot-tooltip';
      var html = '<strong>' + escapeHtml(spot.title) + '</strong>';
      if (spot.text) html += '<br>' + escapeHtml(spot.text);
      if (spot.link) html += '<br><a href="' + escapeHtml(spot.link) + '" target="_blank" rel="noopener">' + escapeHtml(spot.link) + '</a>';
      tip.innerHTML = html;
      el.appendChild(tip);
      return el;
    }

    function renderHotspots(scene, hotspots) {
      if (!hotspots || !Array.isArray(hotspots)) return;
      hotspots.forEach(spot => {
        var el = makeHotspotElement(spot);
        scene.hotspotContainer().createHotspot(el, { yaw: spot.yaw, pitch: spot.pitch });
      });
    }

    // -- hotspot placement (Preview Locally only) --------------------------

    var editingHotspots = false;
    var pendingSlotHotspots = {};
    var editHotspotsBtn = document.getElementById('edit-hotspots-btn');
    var saveHotspotsBtn = document.getElementById('save-hotspots-btn');

    if (isLocalPreview) {
      editHotspotsBtn.style.display = 'inline-block';
      saveHotspotsBtn.style.display = 'inline-block';
    }

    editHotspotsBtn.addEventListener('click', () => {
      editingHotspots = !editingHotspots;
      editHotspotsBtn.textContent = editingHotspots ? 'Stop Placing' : 'Edit Hotspots';
      editHotspotsBtn.classList.toggle('active', editingHotspots);
      document.body.style.cursor = editingHotspots ? 'crosshair' : '';
    });

    saveHotspotsBtn.addEventListener('click', () => {
      var original = saveHotspotsBtn.textContent;
      fetch('/__save_hotspots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ site_id: siteId, slots: pendingSlotHotspots }),
      }).then(res => {
        saveHotspotsBtn.textContent = res.ok ? 'Saved!' : 'Failed, try again';
        setTimeout(() => { saveHotspotsBtn.textContent = original; }, 1400);
      }).catch(() => {
        saveHotspotsBtn.textContent = 'Preview server not reachable';
        setTimeout(() => { saveHotspotsBtn.textContent = original; }, 1800);
      });
    });

    function showHotspotForm(x, y, onSave) {
      var form = document.createElement('div');
      form.className = 'hotspot-form';
      form.style.left = Math.max(8, Math.min(x, window.innerWidth - 256)) + 'px';
      form.style.top = Math.max(8, Math.min(y, window.innerHeight - 230)) + 'px';
      form.innerHTML =
        '<label>Title</label><input type="text" class="hf-title">' +
        '<label>Text</label><textarea class="hf-text" rows="2"></textarea>' +
        '<label>Link (optional)</label><input type="text" class="hf-link">' +
        '<label>Category</label>' +
        '<select class="hf-cat">' +
        '<option value="note">Note</option>' +
        '<option value="issue">Issue</option>' +
        '<option value="measurement">Measurement</option>' +
        '</select>' +
        '<div class="hotspot-form-buttons">' +
        '<button type="button" class="hf-cancel">Cancel</button>' +
        '<button type="button" class="hf-save">Save Pin</button>' +
        '</div>';
      document.body.appendChild(form);

      function close() { form.remove(); }
      form.querySelector('.hf-cancel').addEventListener('click', close);
      form.querySelector('.hf-save').addEventListener('click', () => {
        var spot = {
          title: form.querySelector('.hf-title').value.trim(),
          text: form.querySelector('.hf-text').value.trim(),
          link: form.querySelector('.hf-link').value.trim(),
          category: form.querySelector('.hf-cat').value,
        };
        close();
        onSave(spot);
      });
      form.querySelector('.hf-title').focus();
    }

    function placeHotspotAt(panelEl, view, scene, slotId, clientX, clientY) {
      var rect = panelEl.getBoundingClientRect();
      var coords = view.screenToCoordinates({ x: clientX - rect.left, y: clientY - rect.top });
      showHotspotForm(clientX, clientY, (spotInfo) => {
        var spot = Object.assign({ yaw: coords.yaw, pitch: coords.pitch }, spotInfo);
        if (!pendingSlotHotspots[slotId]) pendingSlotHotspots[slotId] = [];
        pendingSlotHotspots[slotId].push(spot);
        var el = makeHotspotElement(spot);
        scene.hotspotContainer().createHotspot(el, { yaw: spot.yaw, pitch: spot.pitch });
      });
    }
  </script>

</body>
</html>
